<!DOCTYPE html>
<html>
    <head>
        <title>Portifólio de Imagens</title>
    </head>
    <body>
        <h1>Meu Portifólio</h1>

        <h2>Galeria de Fotos:</h2>

        <figure>
            <img src="img/vermelho.jpg" alt="Imagem vermelha" width="150">
            <figcaption>Vermelho</figcaption>  
        </figure>

        <figure>
            <img src="img/azul.jpg" alt="Imagem azul" width="150">
            <figcaption>Azul</figcaption>  
        </figure>

        <figure>
            <img src="img/amarelo.jpg" alt="Imagem amarela" width="150">
            <figcaption>Amarelo</figcaption>  
        </figure>
    </body>
</html>
